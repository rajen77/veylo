appId: io.github.veylo.Client
productName: Veylo
copyright: Copyright (c) Veylo contributors

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - assets/**/*
  - locales/**/*
  - package.json

# The Widevine CDM must never be bundled: ECS downloads it on first launch from
# Google's component service. Shipping it would breach the Widevine licence.
asar: true

# Stock Electron lacks the castLabs Widevine-enabled runtime.
electronDist: node_modules/electron/dist

# Custom plugs make electron-builder invoke snapcraft instead of its template.
snap:
  summary: Lightweight streaming desktop client for Linux

linux:
  target:
    - AppImage
    - deb
    - rpm
    - pacman
    - tar.xz
    - snap
  category: AudioVideo
  icon: build/icons
  synopsis: Lightweight streaming desktop client
  description: >-
    A lightweight streaming desktop client for Linux. Wraps the official
    web players of supported services (Disney+, Netflix, Max, Apple TV+, Prime Video, SkyShowtime, Crunchyroll, Pluto TV, Tubi, Peacock, Paramount+, YouTube, YouTube Music and Plex) in a dedicated
    Chromium shell with Widevine support, hardware video decoding, MPRIS
    media controls and a tray icon.
  desktop:
    entry:
      Name: Veylo
      Categories: AudioVideo;Video;Player;
      Keywords: veylo;streaming;video;player;
      StartupWMClass: veylo
  executableName: veylo
  syncDesktopName: true

# Chromium's runtime dependency names vary by distribution.
deb:
  # Avoid fpm deriving a vendor value containing an email address.
  maintainer: Veylo contributors <maintainers@veylo.invalid>
  vendor: Veylo
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0

rpm:
  # rpm rejects the email address that fpm otherwise includes in the vendor.
  maintainer: Veylo contributors <maintainers@veylo.invalid>
  vendor: Veylo
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - xdg-utils
    - at-spi2-atk
    - libsecret

pacman:
  # Avoid fpm deriving a vendor value containing an email address.
  maintainer: Veylo contributors <maintainers@veylo.invalid>
  vendor: Veylo
  depends:
    - gtk3
    - libnotify
    - nss
    - libxss
    - libxtst
    - xdg-utils
    - at-spi2-core
    - libsecret
