name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run icons
      - run: npx electron-builder --linux AppImage tar.xz deb rpm
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/*.AppImage dist/*.tar.xz dist/*.deb dist/*.rpm)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Veylo ${GITHUB_REF_NAME#v}" --generate-notes
          fi
