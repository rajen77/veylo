name: veylo
base: core22
adopt-info: veylo
summary: Lightweight streaming desktop client for Linux
description: |
  A lightweight streaming desktop client for Linux. Wraps the official web
  players of supported services (Disney+, Netflix, Max, Apple TV+, Prime Video,
  SkyShowtime, Crunchyroll, Pluto TV, Tubi, Peacock, Paramount+, YouTube,
  YouTube Music and Plex) in a dedicated
  Chromium shell with Widevine support, hardware video decoding, MPRIS media
  controls and a tray icon.
grade: stable
confinement: strict
license: MIT

# Reuse electron-builder's snap layout; see docs/SNAP.md.
parts:
  veylo:
    plugin: nil
    source: .
    # The base's Node version is older than the project requires.
    build-snaps:
      - node/20/stable
    build-packages:
      - squashfs-tools # unsquashfs, to unpack electron-builder's output
    build-environment:
      - ELECTRON_GET_USE_PROXY: "true"
    override-build: |
      set -eu
      cd "$CRAFT_PART_SRC"
      npm ci
      npm run icons
      npm run dist:snap
      unsquashfs -d "$CRAFT_PART_INSTALL" dist/veylo_*_amd64.snap
      craftctl set version="$(node -p "require('./package.json').version")"

apps:
  veylo:
    command: command.sh
    plugs:
      - desktop
      - desktop-legacy
      - home
      - x11
      - wayland
      - unity7
      - browser-support
      - network
      - gsettings
      - audio-playback
      - pulseaudio
      - opengl
    environment:
      PATH: $SNAP/usr/sbin:$SNAP/usr/bin:$SNAP/sbin:$SNAP/bin:$PATH
      SNAP_DESKTOP_RUNTIME: $SNAP/gnome-platform
      LD_LIBRARY_PATH: $SNAP_LIBRARY_PATH:$SNAP/lib:$SNAP/usr/lib:$SNAP/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH:$SNAP/lib:$SNAP/usr/lib:$SNAP/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu

# Match electron-builder's runtime and theme content mounts.
plugs:
  gnome-3-28-1804:
    interface: content
    target: $SNAP/gnome-platform
    default-provider: gnome-3-28-1804
  gtk-3-themes:
    interface: content
    target: $SNAP/data-dir/themes
    default-provider: gtk-common-themes
  icon-themes:
    interface: content
    target: $SNAP/data-dir/icons
    default-provider: gtk-common-themes
  sound-themes:
    interface: content
    target: $SNAP/data-dir/sounds
    default-provider: gtk-common-themes